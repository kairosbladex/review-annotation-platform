# Heterogeneous 6-GPU cluster topology, aligned with the real `nvidia-smi` on ai-lingxi:
#   index 0 = NVIDIA L20  (48GB, SM89)
#   index 1 = Tesla T4    (16GB, SM75)
#   index 2 = Tesla T4    (16GB, SM75)
#   index 3 = Tesla T4    (16GB, SM75)
#   index 4 = NVIDIA L20  (48GB, SM89)
#   index 5 = Tesla T4    (16GB, SM75)
# i.e. the two L20 cards are GPU 0 and GPU 4; the four T4 cards are GPU 1, 2, 3 and 5.
# The earlier revision of this file assumed "T4 0..3 + L20 4..5", which does not match the host.
#
# - GPU 1/2/3/5 (T4 SM75): YOLOE TensorRT FP16 high-throughput detection workers behind yoloe-detector-lb
# - GPU 4 (L20 SM89): vLLM BF16 + FlashAttention-2 + Prefix Caching + LoRA serving Qwen3-VL-8B-Instruct (Tier 3)
# - GPU 0 (L20 SM89): second L20; currently hosts light tenant processes (~3GB baseline). Reserved for
#   the Tier 2.5 Jev-Omni fast gate and QLoRA training / offline verification / canary standby.
#
# Ports: host port 8010 is already taken by the unrelated `myolotrain-web-1` container, so the
# Jev-Omni fast gate (deploy/start_jev_omni.sh) binds host port 18010 by default. The container
# still listens on 8010 internally, so the mapping is `127.0.0.1:18010 -> 8010`.
# vLLM keeps its own 8009 mapping.

services:
  # Real GPU index 1 (Tesla T4 16GB)
  yoloe-detector-t4-gpu1:
    image: yoloe_service:latest
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4.0
    labels:
      owner: agent
      gpu_tier: t4_detector
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      TRT_FP16_ENABLE: "1"
      YOLOE_MAX_BATCH_SIZE: "8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # Real GPU index 2 (Tesla T4 16GB)
  yoloe-detector-t4-gpu2:
    image: yoloe_service:latest
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4.0
    labels:
      owner: agent
      gpu_tier: t4_detector
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      TRT_FP16_ENABLE: "1"
      YOLOE_MAX_BATCH_SIZE: "8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  # Real GPU index 3 (Tesla T4 16GB)
  yoloe-detector-t4-gpu3:
    image: yoloe_service:latest
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4.0
    labels:
      owner: agent
      gpu_tier: t4_detector
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      TRT_FP16_ENABLE: "1"
      YOLOE_MAX_BATCH_SIZE: "8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

  # Real GPU index 5 (Tesla T4 16GB) — the fourth T4 lives on index 5, not index 3.
  yoloe-detector-t4-gpu5:
    image: yoloe_service:latest
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4.0
    labels:
      owner: agent
      gpu_tier: t4_detector
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      TRT_FP16_ENABLE: "1"
      YOLOE_MAX_BATCH_SIZE: "8"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["5"]
              capabilities: [gpu]

  # Tier 3 verifier on the dedicated L20 (real GPU index 4, 44GB free at verification time).
  vllm-qwen3vl-l20:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    mem_limit: 32g
    memswap_limit: 32g
    cpus: 8.0
    labels:
      owner: agent
      gpu_tier: l20_vlm_verifier
    ports:
      - "127.0.0.1:${VLLM_L20_PORT:-8009}:8000"
    volumes:
      - ${QWEN3VL_MODEL_DIR:-/data/models/Qwen3-VL-8B-Instruct}:/models/Qwen3-VL-8B-Instruct:ro
      - ${QWEN3VL_LORA_DIR:-/data/models/qwen3vl-ktd-lora}:/models/qwen3vl-ktd-lora:ro
    command:
      - "--model"
      - "/models/Qwen3-VL-8B-Instruct"
      - "--served-model-name"
      - "Qwen/Qwen3-VL-8B-Instruct"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--max-model-len"
      - "8192"
      - "--max-num-seqs"
      - "32"
      - "--enable-prefix-caching"
      - "--enable-lora"
      - "--max-lora-rank"
      - "32"
      - "--lora-modules"
      - "ktd-verifier=/models/qwen3vl-ktd-lora"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4"]
              capabilities: [gpu]
