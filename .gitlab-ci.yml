workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - build
  - integration

default:
  tags:
    - infra-238
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_INDEX_URL: "https://pypi.org/simple"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

cache:
  key:
    files:
      - requirements.txt
      - frontend/package-lock.json
  paths:
    - .cache/pip/
    - .cache/npm/

backend-test:
  stage: validate
  image: python:3.12-slim
  before_script:
    - python3 --version
    - python3 -m pip install --quiet -r requirements.txt pytest
  script:
    - PYTHONPATH=backend python3 -m compileall -q backend scripts migrations
    - PYTHONPATH=backend python3 -m pytest backend/tests -q

luna-autotune-test:
  stage: validate
  image: python:3.12-slim
  before_script:
    - python3 -m pip install --quiet 'Pillow>=10,<12' 'mcp>=1,<2'
  script:
    - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/luna_prompt_autotune -p 'test_*.py' -v

compose-config:
  stage: validate
  image: python:3.12-slim
  before_script:
    - python3 -m pip install --quiet pyyaml
  script:
    - >
      python3 -c 'import yaml; yaml.safe_load(open("docker-compose.yml")); print("docker-compose.yml: YAML OK")'

frontend-build:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    name: "review-annotation-frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/dist/
    expire_in: 1 week

# Requires a privileged Docker executor with the `docker` service enabled.
# Keep this job manual so ordinary merge-request validation does not consume a
# full Compose/DinD environment, while the real-stack check remains one click
# away in every pipeline.
compose-integration:
  stage: integration
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    API_PORT: "8190"
    FRONTEND_PORT: "5173"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - docker info
    - docker compose version
    - docker compose config
  script:
    - docker compose up --build -d
    - |
      ready=0
      for _ in $(seq 1 60); do
        if docker compose exec -T api python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=2).status == 200'; then
          ready=1
          break
        fi
        sleep 2
      done
      test "$ready" = 1
    - docker compose ps
    - docker compose exec -T api alembic current
    - >
      docker compose exec -T api python -c 'import io, uuid; from minio import Minio; c=Minio("minio:9000", access_key="REDACTED_FOR_GITHUB", secret_key="REDACTED_FOR_GITHUB", secure=False); key="_ci-smoke/" + uuid.uuid4().hex + ".txt"; c.put_object("review-annotation", key, io.BytesIO(b"ci-smoke"), 8, content_type="text/plain"); assert c.stat_object("review-annotation", key).size == 8; print("MinIO Compose smoke OK: " + key)'
    - >
      docker compose exec -T frontend wget -qO- http://127.0.0.1/ | grep -q "复核标注工作台"
  after_script:
    - docker compose logs --no-color --tail=100 api worker minio-init || true
    - docker compose down --volumes --remove-orphans || true
