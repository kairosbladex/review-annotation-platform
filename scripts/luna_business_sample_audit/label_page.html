<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Luna 补充样本人工复核</title>
<style>body{font:16px system-ui;margin:24px;color:#142230;background:#f4f6f8}main{max-width:1300px;margin:auto}button,select,input{font:inherit;padding:8px;margin:4px;border:1px solid #bdc8d4;border-radius:6px}button{cursor:pointer;background:white}.views{display:flex;gap:12px;flex-wrap:wrap}figure{flex:1;min-width:290px;background:white;margin:0;padding:10px}canvas{width:100%;height:auto}.note{padding:12px;background:#fff3d0}#status{font-weight:600}.selected{background:#1964a3;color:white}small{color:#516070}</style>
<main><h1>补充样本人工复核</h1><p>黄色框是当前目标。请选择“是 / 不是 / 看不清”，不确定时不要强行判断。本页不展示模型结果和旧标签。</p>
<p class="note">诊断队列用于发现问题，不能代表总体准确率。“近期待核验”尚不满足新盲测条件。干净局部是历史配准图，不是原生高清完整帧；请先核对场景与目标位置。</p>
<select id="filter"><option value="">全部类别</option><option>人员</option><option>违建</option><option>道路裂纹</option></select><button id="prev">上一条</button><button id="next">下一条</button><span id="status"></span><h2 id="title"></h2><p id="basisNote"></p><div class="views" id="views"></div>
<p><button data-label="是">是</button><button data-label="不是">不是</button><button data-label="看不清">看不清</button></p>
<p>依据：<select id="basis"><option value="">请选择</option><option>截图与配准干净局部</option><option>仅截图，缺少原帧</option><option>匹配存疑，需要复核</option></select> 标注人：<input id="reviewer" placeholder="姓名或代号"></p><p>备注：<input id="note" style="width:70%" placeholder="例如：目标被遮挡、配准有偏移"></p><button id="export">导出本地标注 CSV</button><p><small>修改仅保存在当前浏览器；导出后再交给验收者。本页没有上传、保存业务或触发复检的接口。</small></p></main>
<script>
const data=/*DATA*/[];let selected=data,at=0;const storageKey='luna-annotation-20261011-'+data.map(x=>x.sample_id).join('|');let answers={};try{answers=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{};
const el=id=>document.getElementById(id);const current=()=>selected[at];function save(){let r=current();if(!r)return;let a=answers[r.sample_id]||{};a.basis=el('basis').value;a.reviewer=el('reviewer').value;a.note=el('note').value;answers[r.sample_id]=a;try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch{}}
function draw(r,k,path){let f=document.createElement('figure'),cap=document.createElement('figcaption'),c=document.createElement('canvas');cap.textContent=({screenshot:'截图与目标位置',annotated_context:'截图局部',clean_context:'配准干净局部（非原生高清）'})[k];f.append(cap,c);el('views').append(f);let im=new Image();im.onload=()=>{c.width=im.width;c.height=im.height;let ctx=c.getContext('2d');ctx.drawImage(im,0,0);let b=r.bbox.map((v,i)=>v*(i%2?im.height:im.width));if(k!=='screenshot'){let s=r[k==='clean_context'?'clean_source_box':'annotated_source_box'],q=r.target_bbox_px;b=q.map((v,i)=>(v-s[i%2])/(s[i%2+2]-s[i%2])*(i%2?im.height:im.width))}if(k!=='screenshot'&&r.source_frame_size){let s=r[k==='clean_context'?'clean_source_box':'annotated_source_box'],sz=r.source_frame_size;let x=Math.max(0,-s[0])/(s[2]-s[0])*im.width,y=Math.max(0,-s[1])/(s[3]-s[1])*im.height,x2=Math.min(im.width,(sz[0]-s[0])/(s[2]-s[0])*im.width),y2=Math.min(im.height,(sz[1]-s[1])/(s[3]-s[1])*im.height);ctx.fillStyle='rgba(240,240,240,.94)';ctx.fillRect(0,0,im.width,y);ctx.fillRect(0,y2,im.width,im.height-y2);ctx.fillRect(0,y,x,y2-y);ctx.fillRect(x2,y,im.width-x2,y2-y);cap.textContent+='；灰区为补边，不是真实画面'}ctx.strokeStyle='#ffe500';ctx.lineWidth=Math.max(2,im.width/300);ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1])};im.onerror=()=>{cap.textContent+='：图片不可用，请不要标注'};im.src=path}
function render(){el('views').replaceChildren();let r=current();if(!r){el('title').textContent='没有样本';return}let a=answers[r.sample_id]||{};el('status').textContent=`${at+1}/${selected.length} · 已选 ${Object.values(answers).filter(x=>x.label).length}/${data.length}`;el('title').textContent=`${r.class_name} · ${r.queue==='diagnostic'?'诊断队列':'近期待核验'} · ${r.sample_id}`;el('basisNote').textContent=r.clean_note;for(let [k,p]of Object.entries(r.files))draw(r,k,p);for(let k of ['basis','reviewer','note'])el(k).value=a[k]||'';document.querySelectorAll('[data-label]').forEach(b=>b.classList.toggle('selected',b.dataset.label===a.label))}
el('prev').onclick=()=>{save();at=Math.max(0,at-1);render()};el('next').onclick=()=>{save();at=Math.min(selected.length-1,at+1);render()};el('filter').onchange=()=>{save();selected=data.filter(r=>!el('filter').value||r.class_name===el('filter').value);at=0;render()};for(let k of ['basis','reviewer','note'])el(k).onchange=save;document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{save();let r=current();if(!r)return;answers[r.sample_id]={...answers[r.sample_id],label:b.dataset.label,reviewed_at:new Date().toISOString()};save();render()});
el('export').onclick=()=>{save();const fields=['sample_id','queue','class_name','label','basis','reviewer','note','reviewed_at'];const escape=v=>'"'+String(v??'').replaceAll('"','""')+'"';let lines=[fields.join(',')];for(let r of data){let a=answers[r.sample_id]||{};lines.push(fields.map(k=>escape({...r,...a}[k])).join(','))}let url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='luna-human-review.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
