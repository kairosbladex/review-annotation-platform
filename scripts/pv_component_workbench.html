<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光伏组件位置确认</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#22334a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1600px;margin:auto}h1{font-size:23px;margin:0 0 6px}p{line-height:1.55;margin:7px 0}.muted{color:#62738a;font-size:13px}.card{background:#fff;border:1px solid #dce4ed;border-radius:12px;padding:16px;margin:12px 0;min-width:0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #bdcbdc;padding:9px 12px;border-radius:7px;max-width:100%}button{background:#f6f8fb;cursor:pointer}button.primary{background:#185cc4;color:white;border-color:#185cc4}button:disabled{opacity:.45;cursor:default}label{font-size:14px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{padding:10px 15px;border-radius:8px;background:#e9eef5;color:#62738a}.step.active{background:#e0edff;color:#164f9f;font-weight:600}.step.done{background:#e1f4e9;color:#22734c}.notice{background:#eaf2ff;border-left:4px solid #2761ac;padding:13px 16px;font-size:17px;font-weight:600}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.reference{background:#f6f9fc;border-radius:8px;padding:10px}.viewer{overflow:auto;max-height:74vh;background:#142033;border-radius:8px;min-width:0;position:relative}#photo{display:block;cursor:crosshair;max-width:none}#layout{width:100%;height:auto;display:block}.badge{font-size:13px;background:#edf3fb;border-radius:5px;padding:5px 8px}#message{white-space:pre-wrap;color:#9e3327}#result{white-space:pre-wrap;line-height:1.65}.hidden{display:none!important}details{font-size:13px;color:#62738a}pre{white-space:pre-wrap;max-height:250px;overflow:auto}#selectedCode{font-size:17px;font-weight:600;word-break:break-all}#cornerHelp{font-size:16px;font-weight:600;color:#205eae}#savedList{font-size:14px;line-height:1.9}.small{font-size:12px} @media(max-width:800px){body{padding:12px}.workspace{grid-template-columns:1fr}.reference{display:grid;grid-template-columns:170px 1fr;gap:8px}.reference canvas{grid-row:span 3}.steps{font-size:13px}}
</style>
</head>
<body>
<h1>确认照片里的组件位置</h1>
<p class="muted">选组件编号 → 按左图提示，在照片上点四个角 → 换下一块。全程只保存本地验证记录。</p>
<div class="card row"><label>照片 <select id="cases"></select></label><span id="counts" class="badge"></span></div>
<div class="steps"><span id="step0" class="step">1 · 标第一块</span><span id="step1" class="step">2 · 标另一端的一块</span><span id="step2" class="step">3 · 核对中间一块</span><span id="step3" class="step">4 · 查看结果</span></div>
<div class="card">
  <div id="instruction" class="notice">先选一块你能确认编号的组件。</div>
  <div class="row" style="margin:14px 0"><label>第几行 <select id="rows"></select></label><label>第几列 <select id="columns"></select></label><button id="choose" class="primary">选这块，开始点角</button><button id="change" class="hidden">换一块</button><span id="selectedCode"></span></div>
  <div class="workspace">
    <div class="reference">
      <canvas id="layout" width="360" height="320" aria-label="规划角点顺序，黄色为下一次要点的角"></canvas>
      <p id="cornerHelp">黄色圆点是接下来要确认的角。</p>
      <p id="selectionHelp" class="muted">先选编号。左图会放大这块组件，并标出四个角。</p>
      <div id="savedList"></div>
    </div>
    <div>
      <div class="row" style="margin-bottom:8px"><span class="muted">原始照片 · 红框是光斑</span><label>放大 <select id="zoom"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option></select></label><button id="rotate">照片转 90°</button><button id="undo" disabled>撤销上一个点</button></div>
      <div class="viewer"><canvas id="photo" aria-label="点击照片中对应的组件角点"></canvas></div>
    </div>
  </div>
  <div class="row" style="margin-top:16px"><button id="next" class="primary" disabled>这四个角点好了</button><button id="validate" class="primary hidden">我确认编号和角点正确，开始验证</button><button id="restart">重新开始本次标注</button></div>
  <p id="message" role="status"></p>
</div>
<div class="card"><h2 style="font-size:17px;margin-top:0">验证结果</h2><p id="result">还未完成三块组件的角点确认。</p><button id="extend" class="hidden">继续补充其他组件</button><details><summary>查看验证明细 / 导出锚点</summary><pre id="details"></pre><button id="export">导出当前锚点 JSON</button><p id="receipt" class="small"></p></details></div>
<script>
const $=id=>document.getElementById(id);
let token='',data=null,img=new Image(),marks=[],currentId=null,points=[],stage=0,rotation=0,result=null,busy=false;
const lc=$('layout').getContext('2d'),pc=$('photo').getContext('2d');
const errorNames={HUMAN_ANCHORS_UNCONFIRMED:'角点尚未确认',NEED_4_FIT_AND_2_INDEPENDENT_CHECKS:'可用角点不足，请补充组件',DUPLICATE_OR_LEAKED_CHECK_POINT:'用于核对的角点与前面的点重复，请换一块组件',NON_COPLANAR_COMPONENTS:'这些组件不在同一平面，需要分开标注',REGISTRATION_CHECK_FAILED:'第三块的检查未通过，请核对编号和角点',DEGENERATE_CONTROLS:'两块参考组件距离或角点分布不合适，请重新选择',NO_VALID_REGISTRATION:'尚无通过检查的对应关系',NO_COMPONENT_COVERAGE:'光斑不在已确认的组件范围内',BOUNDARY_OR_MULTIPLE_CANDIDATES:'靠近边界，或存在多个候选，需要继续核对',COMPONENT_TOO_SMALL:'组件太小，暂时无法可靠确认'};
function note(text){$('message').textContent=text}
function opt(value,label){const e=document.createElement('option');e.value=value;e.textContent=label;return e}
async function api(path,options){const r=await fetch(path,options);if(!r.ok){const s=await r.json().catch(()=>({detail:r.statusText}));throw Error(typeof s.detail==='string'?s.detail:'数据格式不正确，请核对标注')}return r.json()}
function component(id){return data.input.components.find(c=>c.id===id)}
function key(){return 'pv-corners-v2:'+data.input.image_sha256+':'+data.input.layout_sha256}
function persist(){try{localStorage.setItem(key(),JSON.stringify({marks,currentId,points,stage,rotation}))}catch(_){}}
function invalidate(){result=null;$('details').textContent='';$('receipt').textContent='';$('result').textContent='标注已变化，请完成后重新验证。'}
function target(){return component(currentId||$('columns').value)}
function populateColumns(){const row=Number($('rows').value);$('columns').replaceChildren();data.input.components.filter(c=>c.row===row).sort((a,b)=>a.column-b.column).forEach(c=>$('columns').append(opt(c.id,'第 '+c.column+' 列')));render()}
function stepText(){if(stage===0)return '第一步：选一块你能确认编号的组件，尽量选在要定位区域的一端。';if(stage===1)return '第二步：在同一排的另一端再选一块，让光斑位于这两块之间。';if(stage===2)return '第三步：选前两块之间的一块做核对，尽量不与前两块共边。';return '三块已标好。确认编号和角点后，点击下方蓝色按钮验证。'}
function render(){for(let i=0;i<4;i++)$('step'+i).className='step'+(i<stage?' done':i===stage?' active':'');$('instruction').textContent=currentId?`现在请点第 ${Math.min(points.length+1,4)} 个角：对应左图黄色圆点。`:stepText();$('rows').disabled=!!currentId;$('columns').disabled=!!currentId;$('choose').classList.toggle('hidden',!!currentId||stage>=3);$('change').classList.toggle('hidden',!currentId);$('next').classList.toggle('hidden',stage>=3&&!currentId);$('next').disabled=points.length!==4||busy;$('validate').classList.toggle('hidden',stage<3||!!currentId);$('validate').disabled=busy;$('undo').disabled=!points.length;$('selectedCode').textContent=target()?.code||'';$('cornerHelp').textContent=currentId?(points.length<4?`在照片上点黄色 ${points.length+1} 号角`:'四个角已齐，点击“这四个角点好了”。'):'选好组件后，黄色角点会逐个提示。';$('selectionHelp').textContent='照片与规划方向可能不同。按同一个物理角对应，不要直接按照片的左上角开始。可转动照片帮助对照。';$('savedList').replaceChildren();marks.forEach((m,i)=>{const el=document.createElement('div');el.textContent=`✓ 第 ${i+1} 块：${component(m.component_id).code}`;$('savedList').append(el)});draw()}
function poly(ctx,xy,color){ctx.beginPath();xy.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
function scalePhoto(){if(!data)return;const c=$('photo');c.style.width=c.parentElement.clientWidth*Number($('zoom').value)+'px';c.style.height='auto'}
function draw(){if(!data)return;lc.fillStyle='#f5f8fc';lc.fillRect(0,0,360,320);const c=target();if(c){const v=c.vertices,xs=v.map(v=>v[0]),ys=v.map(v=>v[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),s=Math.min(230/(maxX-minX||1),200/(maxY-minY||1));const xy=v.map(v=>[180+(v[0]-(minX+maxX)/2)*s,160-(v[1]-(minY+maxY)/2)*s]);poly(lc,xy,'#567490');xy.forEach((p,i)=>{const active=currentId&&i===points.length;lc.fillStyle=active?'#efb52e':i<points.length&&currentId?'#288959':'#d7e3f1';lc.beginPath();lc.arc(...p,18,0,Math.PI*2);lc.fill();lc.fillStyle='#17375d';lc.font='bold 19px sans-serif';lc.textAlign='center';lc.textBaseline='middle';lc.fillText(String(i+1),...p)});lc.textAlign='left';lc.textBaseline='alphabetic';lc.font='13px sans-serif';lc.fillText('规划方向：北 ↑',14,24)}
const w=data.input.image_width,h=data.input.image_height,odd=rotation%2;$('photo').width=odd?h:w;$('photo').height=odd?w:h;pc.save();pc.translate($('photo').width/2,$('photo').height/2);pc.rotate(rotation*Math.PI/2);pc.translate(-w/2,-h/2);if(img.complete&&img.naturalWidth)pc.drawImage(img,0,0);data.input.detections.forEach(d=>{const [x,y,x2,y2]=d.bbox_xyxy;pc.strokeStyle='#ff6868';pc.lineWidth=2;pc.strokeRect(x,y,x2-x,y2-y);pc.fillStyle='#ff6868';pc.font='18px sans-serif';pc.fillText('#'+d.index,x,y-7)});if(result)result.registration.forEach(p=>{if(p.polygons)Object.entries(p.polygons).forEach(([id,xy])=>{poly(pc,xy,p.status==='valid'?'#50ee9a':'#ffb558');const cc=component(id),mid=xy.reduce((s,p)=>[s[0]+p[0]/4,s[1]+p[1]/4],[0,0]);pc.font='15px sans-serif';pc.fillStyle='#50ee9a';pc.fillText(`${cc.row}/${cc.column}`,...mid)})});for(const [list,color] of [...marks.map(m=>[m.pixels,'#68c6f7']),[points,'#ffd35c']]){list.forEach((p,i)=>{pc.fillStyle=color;pc.beginPath();pc.arc(...p,5,0,Math.PI*2);pc.fill();pc.font='bold 19px sans-serif';pc.fillText(String(i+1),p[0]+7,p[1]-7)});if(list.length===4)poly(pc,list,color)}pc.restore();scalePhoto()}
function sourcePixel(e){const c=$('photo'),r=c.getBoundingClientRect(),u=(e.clientX-r.left)*c.width/r.width,v=(e.clientY-r.top)*c.height/r.height,w=data.input.image_width,h=data.input.image_height;return ([[u,v],[v,h-u],[w-u,h-v],[w-v,u]][rotation]).map(x=>Math.round(x*100)/100)}
function uniqueVertex(c,v){return c.vertices[v].map(n=>n.toFixed(6)).join(',')}
function calibration(){const groups=new Map();for(const mark of marks){const c=component(mark.component_id);if(!groups.has(c.row))groups.set(c.row,[]);groups.get(c.row).push(mark)}const planes=[];for(const [row,items] of groups){const columns=items.map(m=>component(m.component_id).column),min=Math.min(...columns),max=Math.max(...columns),seen=new Set(),anchors=[];for(const item of items){const c=component(item.component_id);item.pixels.forEach((pixel,vertex)=>{const k=uniqueVertex(c,vertex);if(seen.has(k))return;seen.add(k);anchors.push({component_id:c.id,vertex,pixel,role:item.role})})}planes.push({id:'row-'+row,component_ids:data.input.components.filter(c=>c.row===row&&c.column>=min&&c.column<=max).map(c=>c.id),reviewer:'local-workbench-user',human_confirmed:true,anchors})}return {image_sha256:data.input.image_sha256,layout_sha256:data.input.layout_sha256,planes}}
async function loadCase(){data=await api('/api/cases/'+$('cases').value);marks=[];currentId=null;points=[];stage=0;rotation=0;result=null;$('rows').replaceChildren();[...new Set(data.input.components.map(c=>c.row))].sort((a,b)=>a-b).forEach(r=>$('rows').append(opt(r,'第 '+r+' 行')));populateColumns();try{const saved=JSON.parse(localStorage.getItem(key()));if(saved&&Array.isArray(saved.marks)){marks=saved.marks;currentId=saved.currentId;points=saved.points;stage=saved.stage;rotation=saved.rotation||0;const c=component(currentId||marks[0]?.component_id);if(c){$('rows').value=c.row;populateColumns();$('columns').value=c.id}}}catch(_){}$('counts').textContent=data.case.matrix_name+' · '+data.input.detections.length+' 个光斑框';img=new Image();img.onload=draw;img.src='/api/cases/'+data.case.id+'/image';$('result').textContent=data.calibration?'已有本地验证记录；重新标注不会自动覆盖，需再次点击验证。':'还未完成三块组件的角点确认。';$('details').textContent='';$('receipt').textContent='';$('extend').classList.add('hidden');note('');render()}
$('rows').onchange=populateColumns;$('columns').onchange=render;
$('choose').onclick=()=>{const c=target();if(marks.some(m=>m.component_id===c.id)){note('这块已标过，请选另一块。');return}if(stage===1&&c.row!==component(marks[marks.length-1].component_id).row){note('这一轮请选同一排的组件。其他排可以在结果出来后另补。');return}if(stage===2){const same=marks.slice(-2).map(m=>component(m.component_id));if(c.row!==same[0].row||c.column<=Math.min(...same.map(x=>x.column))||c.column>=Math.max(...same.map(x=>x.column))){note('请选刚才两块之间、同一排的一块；如果两块紧挨着，请重新开始，选间隔更远的两块。');return}}currentId=c.id;points=[];invalidate();note('先找到照片里的这块组件，再按左图编号顺序点角。');persist();render()};
$('change').onclick=()=>{currentId=null;points=[];persist();render()};
$('photo').onclick=e=>{if(!currentId){note('先选择组件编号，再点击“选这块，开始点角”。');return}if(points.length===4){note('四个角已经点齐。点“这四个角点好了”继续，或撤销修改。');return}const p=sourcePixel(e);if(p[0]<0||p[1]<0||p[0]>=data.input.image_width||p[1]>=data.input.image_height)return;points.push(p);invalidate();persist();render()};
$('undo').onclick=()=>{points.pop();invalidate();persist();render()};
$('next').onclick=()=>{if(points.length!==4)return;const c=component(currentId);marks.push({component_id:c.id,pixels:points.map(p=>[...p]),role:stage===2?'check':'fit'});currentId=null;points=[];stage++;invalidate();persist();note(stage===3?'三块已标好。检查编号无误后，点击蓝色验证按钮。':'');render()};
$('rotate').onclick=()=>{rotation=(rotation+1)%4;persist();draw()};$('zoom').onchange=scalePhoto;window.addEventListener('resize',scalePhoto);
$('restart').onclick=()=>{marks=[];points=[];currentId=null;stage=0;rotation=0;invalidate();persist();note('已清空当前草稿；此前保存的验证记录仍保留。');render()};
$('validate').onclick=async()=>{busy=true;render();try{token=(await api('/api/cases')).token;const body=calibration();const response=await api('/api/cases/'+data.case.id+'/calibration',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench-Token':token},body:JSON.stringify(body)});result=response.result;const lines=[];for(const p of result.registration){lines.push(p.status==='valid'?'✓ 这一排的角点对应通过独立检查。':'需要调整：'+(errorNames[p.reason]||p.reason))}for(const r of result.results)lines.push(r.status==='matched'?`光斑 #${r.index} → ${r.code}`:`光斑 #${r.index}：${errorNames[r.reason]||r.reason}`);lines.push('这是本地组件对应结果，尚未更新业务事件。');$('result').textContent=lines.join('\n');$('details').textContent=JSON.stringify(result,null,2);$('receipt').textContent=response.receipt;$('extend').classList.remove('hidden');note('结果已保存。绿色轮廓表示通过检查的组件对应。');draw()}catch(e){note(e.message)}finally{busy=false;render()}};
$('extend').onclick=()=>{stage=0;currentId=null;points=[];persist();note('可为另一排再标三块组件，或补充当前排的参考。');render()};
$('export').onclick=()=>{const value={...calibration(),planes:calibration().planes.map(p=>({...p,human_confirmed:false}))};const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=data.case.id+'-draft-anchors.json';a.click();URL.revokeObjectURL(a.href)};
$('cases').onchange=()=>loadCase().catch(e=>note(e.message));
api('/api/cases').then(config=>{token=config.token;config.cases.forEach(c=>$('cases').append(opt(c.id,c.matrix_name+' · '+c.id.slice(0,8))));const id=new URLSearchParams(location.search).get('case');if(id&&config.cases.some(c=>c.id===id))$('cases').value=id;return loadCase()}).catch(e=>note(e.message));
</script>
</body></html>
