<!doctype html><html lang="zh"><meta charset="utf-8"><title>复检补标</title><style>body{font-family:system-ui;margin:24px;background:#f4f6f8}button{padding:12px;margin:8px}img{max-width:95%;max-height:70vh}.row{display:flex;gap:16px}.row img{max-width:48%}</style><h1>复检补标</h1><p>只依据图片判断黄色框目标。可打开干净原图；不显示模型建议。</p><div id="progress"></div><div class="row"><img id="context"><img id="crop"></div><a id="original" target="_blank">查看高清干净原图</a><div><button onclick="label('真目标')">真目标</button><button onclick="label('误检')">误检</button><button onclick="label('看不清')">看不清</button><button onclick="next()">跳过</button></div><input id="note" placeholder="可选备注"><script>let rows=[],i=0;async function init(){rows=(await(await fetch('/api/rows')).json()).rows;i=rows.findIndex(x=>!x.label);if(i<0)i=0;show()}function show(){let r=rows[i];document.getElementById('progress').textContent=`${i+1}/${rows.length}，已标 ${rows.filter(x=>x.label).length}，${r.candidate_id}`;context.src=`images/${r.slug}-context.jpg`;crop.src=`images/${r.slug}-crop.jpg`;original.href=`images/${r.slug}.jpg`;note.value=r.note||''}function next(){i=(i+1)%rows.length;show()}async function label(v){let r=rows[i];let x=await fetch('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_id:r.candidate_id,label:v,note:note.value})});if(!x.ok){alert('保存失败');return}r.label=v;next()}init()</script></html>
