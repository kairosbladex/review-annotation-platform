<!doctype html><html lang="zh"><meta charset="utf-8"><title>光斑新样本标注</title><style>
body{font:16px system-ui;margin:20px;background:#f4f6f8;color:#182230}header,.controls,.panel{background:white;padding:16px;border-radius:10px;margin-bottom:12px}h1{font-size:24px;margin:0 0 10px}button,input{font:inherit;padding:8px;margin:4px;border:1px solid #ccd3db;border-radius:6px}button{cursor:pointer;background:white}button[data-label]{background:#e8f0ff}#error{color:#a01818}#canvas{max-width:100%;touch-action:none;cursor:crosshair}#shot{max-width:380px;max-height:360px}.views{display:flex;gap:16px;flex-wrap:wrap}p{line-height:1.65;margin:6px 0}#full{display:none;max-width:100%}.small{font-size:14px;color:#526171}
</style><header><h1>光斑新样本标注</h1><p><b>先拖动鼠标框住目标，再选一个判断。</b>蓝色十字只是原系统记录的位置，不是目标大小；不要把整张局部图都框进去。</p><p>光斑：光伏板表面局部异常亮斑。板外亮点、整片均匀发亮不算。位置对不上或看不清，可以不画框，直接选“看不清”。</p><p class="small">左侧是未加标记的原图局部，可隐藏十字；右侧截图只帮助找位置。判断以原图为准。结果只保存在本机。</p></header>
<div class="controls"><b id="progress">正在加载</b><span id="saved"></span><br><button id="prev">上一处</button><button id="next">下一处</button><button id="pending">跳到未标</button><button id="clear">清除方框</button><button id="guide">隐藏十字</button><button id="toggleFull">查看完整原图</button><br><button data-label="是光斑">1 是光斑</button><button data-label="不是光斑">2 不是光斑</button><button data-label="看不清">3 看不清</button><input id="note" placeholder="备注（可选）"><span id="error" role="alert"></span></div>
<div class="views"><section class="panel"><b>原图局部：在这里画框</b><br><canvas id="canvas" width="640" height="640"></canvas></section><section class="panel"><b>截图：仅用于定位</b><br><img id="shot" alt="对应截图"><p id="info" class="small"></p></section></div><section class="panel"><img id="full" alt="完整原图"></section>
<script>
let rows=[],i=0,img=new Image(),crop=null,box=null,start=null,showGuide=true,busy=false,epoch=0;
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');
function draw(){if(!crop)return;ctx.clearRect(0,0,640,640);ctx.drawImage(img,...crop,0,0,640,640);if(showGuide){const p=rows[i].raw_point,x=(p[0]-crop[0])/crop[2]*640,y=(p[1]-crop[1])/crop[3]*640;ctx.strokeStyle='#0084ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-10,y);ctx.lineTo(x+10,y);ctx.moveTo(x,y-10);ctx.lineTo(x,y+10);ctx.stroke()}if(box){const [w,h]=rows[i].raw_size;ctx.strokeStyle='#00a342';ctx.lineWidth=2;ctx.strokeRect((box[0]*w-crop[0])/crop[2]*640,(box[1]*h-crop[1])/crop[3]*640,(box[2]-box[0])*w/crop[2]*640,(box[3]-box[1])*h/crop[3]*640)}}
async function show(){if(!rows.length){$('progress').textContent='没有样本';return}const r=rows[i],my=++epoch;crop=null;start=null;box=r.bbox? [...r.bbox]:null;$('note').value=r.note||'';$('error').textContent='';$('progress').textContent=`第 ${i+1}/${rows.length} 处 · 已标 ${rows.filter(x=>x.label).length} · 未标 ${rows.filter(x=>!x.label).length}`;$('saved').textContent=r.label?' 当前：'+r.label:'';$('info').textContent=r.task_name+' · '+r.event_time;$('shot').src='/'+r.screenshot_image;$('full').src='/'+r.raw_image;$('full').style.display='none';img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='/'+r.raw_image}).catch(()=>{$('error').textContent='图片无法打开，请先不要标注'});if(my!==epoch||!img.naturalWidth)return;const [w,h]=r.raw_size,[x,y]=r.raw_point,side=Math.min(480,w,h);crop=[Math.max(0,Math.min(w-side,x-side/2)),Math.max(0,Math.min(h-side,y-side/2)),side,side];draw()}
function point(e){const b=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))]}
c.onpointerdown=e=>{if(!crop||busy)return;start=point(e);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!start||!crop)return;const p=point(e),[w,h]=rows[i].raw_size;box=[(crop[0]+Math.min(start[0],p[0])*crop[2])/w,(crop[1]+Math.min(start[1],p[1])*crop[3])/h,(crop[0]+Math.max(start[0],p[0])*crop[2])/w,(crop[1]+Math.max(start[1],p[1])*crop[3])/h];draw()};c.onpointerup=()=>{start=null;if(box&&(box[2]-box[0]<=0||box[3]-box[1]<=0))box=null;draw()};
async function mark(label){if(busy||!crop)return;if(!box&&label!=='看不清'){$('error').textContent='先在左侧原图上拖动鼠标画框';return}busy=true;const index=i;try{const r=rows[index],res=await fetch('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:r.key,label,bbox:box,note:$('note').value})});const data=await res.json();if(!res.ok)throw Error(data.error);r.label=label;r.bbox=box?[...box]:null;r.note=$('note').value;i=Math.min(rows.length-1,index+1);await show()}catch(e){$('error').textContent=e.message}finally{busy=false}}
document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>mark(b.dataset.label));$('prev').onclick=()=>{if(!busy&&i>0){i--;show()}};$('next').onclick=()=>{if(!busy&&i<rows.length-1){i++;show()}};$('pending').onclick=()=>{if(busy)return;let n=rows.findIndex(r=>!r.label);if(n>=0){i=n;show()}};$('clear').onclick=()=>{box=null;draw()};$('guide').onclick=()=>{showGuide=!showGuide;$('guide').textContent=showGuide?'隐藏十字':'显示十字';draw()};$('toggleFull').onclick=()=>{$('full').style.display=$('full').style.display==='block'?'none':'block'};
document.onkeydown=e=>{if(e.target.tagName==='INPUT'||busy)return;const map={'1':'是光斑','2':'不是光斑','3':'看不清'};if(map[e.key])mark(map[e.key])};fetch('/api/rows').then(r=>r.json()).then(d=>{rows=d.rows;i=Math.max(0,rows.findIndex(r=>!r.label));show()}).catch(()=>{$('error').textContent='加载失败，请刷新'});
</script></html>
