<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>车辆支撑面 · 高清原帧复核</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #202124; }
    header { padding: 14px 24px 10px; background: #fff; border-bottom: 1px solid #dfe1e5; position: sticky; top: 0; z-index: 2; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .meta { color: #5f6368; font-size: 13px; }
    main { max-width: 1480px; margin: 0 auto; padding: 16px 20px 50px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    button { border: 1px solid #c7cbd1; background: #fff; border-radius: 7px; padding: 8px 14px; font-size: 15px; cursor: pointer; }
    button:hover { border-color: #3867d6; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .toggle.on { background: #e8f0fe; border-color: #3867d6; }
    .count { margin-left: auto; font-size: 14px; color: #5f6368; }
    .card { background: #fff; border: 1px solid #dfe1e5; border-radius: 8px; padding: 16px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .candidate { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
    figure { margin: 0; }
    figure img, figure video { display: block; width: 100%; max-height: 66vh; object-fit: contain; background: #1f2124; border-radius: 5px; }
    figcaption { margin-top: 6px; color: #6b7075; font-size: 12.5px; line-height: 1.5; }
    .side { display: grid; gap: 14px; }
    .neighbors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
    .neighbors img { max-height: 160px; }
    .lowres img { max-height: 180px; width: auto; max-width: 100%; image-rendering: pixelated; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .label-button { min-height: 48px; font-weight: 600; font-size: 16px; }
    .car { border-color: #2f6fed; color: #174ea6; }
    .facility { border-color: #d69200; color: #8a5b00; }
    .unclear { border-color: #7b61a8; color: #5d3f8f; }
    .label-button.selected { box-shadow: 0 0 0 3px #20212433; background: #f1f3f4; }
    .note { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 8px; border: 1px solid #dfe1e5; border-radius: 5px; font: inherit; }
    .status { min-height: 20px; margin-top: 8px; color: #18794e; font-size: 14px; }
    .error { color: #b3261e; }
    .prior { font-size: 13px; color: #5f6368; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>车辆支撑面 · 高清原帧复核</h1>
    <div class="meta">画面来自服务器原始视频 1920×1080 匹配帧（或 4032×3024 原图），黄框由低清坐标投影而来。快捷键：1 真车 · 2 屋顶设施 · 3 看不清 · B 显示/隐藏框 · ←/→ 翻页。</div>
  </header>
  <main>
    <div class="toolbar">
      <button id="prev">上一张</button>
      <button id="next">下一张</button>
      <button id="unlabeled">跳到未标</button>
      <button id="box-toggle" class="toggle on">显示框 (B)</button>
      <button id="prior-toggle" class="toggle">显示原低清标签</button>
      <span id="count" class="count"></span>
    </div>
    <section class="card">
      <div class="card-head"><span id="candidate" class="candidate"></span><span id="source" class="meta"></span></div>
      <div class="grid">
        <div>
          <figure><img id="crop" alt="高清局部"><figcaption id="crop-caption"></figcaption></figure>
          <div id="neighbors" class="neighbors"></div>
          <figcaption id="neighbors-caption"></figcaption>
        </div>
        <div class="side">
          <figure><video id="clip" muted loop playsinline autoplay controls></video><figcaption id="clip-caption"></figcaption></figure>
          <figure><a id="frame-link" target="_blank"><img id="frame" alt="完整原帧"></a><figcaption>完整原帧（点击在新标签页打开原尺寸）</figcaption></figure>
          <figure class="lowres"><img id="lowres" alt="原低清裁图"><figcaption>对照：原 960×720 低清裁图</figcaption></figure>
        </div>
      </div>
      <div class="actions">
        <button class="label-button car" data-label="真车">1 · 真车</button>
        <button class="label-button facility" data-label="屋顶设施">2 · 屋顶设施</button>
        <button class="label-button unclear" data-label="看不清">3 · 看不清</button>
      </div>
      <input id="note" class="note" placeholder="可选：补充判断原因">
      <div id="prior" class="prior" hidden></div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script>
    const PKG = '/hires-review-package/';
    const state = { rows: [], views: {}, index: 0, showBox: true, showPrior: false };
    const $ = (id) => document.getElementById(id);
    const labeled = () => state.rows.filter((r) => r.label).length;
    function render() {
      const row = state.rows[state.index];
      if (!row) return;
      const v = state.views[row.candidate_id];
      $('candidate').textContent = `${state.index + 1} / ${state.rows.length} · ${row.candidate_id}`;
      $('source').textContent = row.source_kind === 'video'
        ? `原视频 ${row.source_width}×${row.source_height} · 第 ${Number(row.frame_time).toFixed(3)} 秒 · 与低清图局部相似度 ${row.roi_ncc}`
        : `静态原图 ${row.source_width}×${row.source_height} · 与低清图局部相似度 ${row.roi_ncc}`;
      $('crop').src = PKG + (state.showBox ? v.crop_boxed : v.crop);
      $('crop-caption').textContent = `高清局部：目标框在原帧中约 ${row.projected_box_w_px}×${row.projected_box_h_px} 像素，显示放大 ${v.display_scale} 倍（放大只便于观看，不会增加原片没有的细节）。`;
      $('neighbors').innerHTML = '';
      v.neighbors.forEach((n) => {
        const fig = document.createElement('figure');
        fig.innerHTML = `<img src="${PKG + n.file}"><figcaption>${n.offset_seconds > 0 ? '+' : ''}${n.offset_seconds} 秒</figcaption>`;
        $('neighbors').appendChild(fig);
      });
      $('neighbors-caption').textContent = v.neighbors.length ? '相邻时刻同一像素区域：无人机在移动时画面会偏，仅作辅助，不代表该目标本身。' : '';
      if (v.clip) {
        $('clip').hidden = false; $('clip').src = PKG + v.clip; $('clip').play().catch(() => {});
        $('clip-caption').textContent = '匹配时刻前后各 2 秒的同区域原片（无框；相机移动时目标会漂移）。可看目标是否在动。';
      } else {
        $('clip').hidden = true; $('clip').removeAttribute('src');
        $('clip-caption').textContent = '静态原图，没有视频片段。';
      }
      $('frame').src = PKG + v.frame_boxed;
      $('frame-link').href = PKG + (state.showBox ? v.frame_boxed : v.frame);
      $('lowres').src = '/' + row.lowres_crop;
      $('note').value = row.note || '';
      $('prior').hidden = !state.showPrior;
      $('prior').textContent = `原低清标签：${row.lowres_label || '（空）'}${row.lowres_note ? ' · ' + row.lowres_note : ''}`;
      $('count').textContent = `已标 ${labeled()} / ${state.rows.length}`;
      document.querySelectorAll('[data-label]').forEach((b) => b.classList.toggle('selected', b.dataset.label === row.label));
      $('prev').disabled = state.index === 0;
      $('next').disabled = state.index >= state.rows.length - 1;
      $('status').textContent = row.label ? `当前已保存：${row.label}` : '尚未标注';
      $('status').className = 'status';
    }
    async function load() {
      const [rowsResp, viewsText] = await Promise.all([fetch('/api/rows').then((r) => r.json()), fetch(PKG + 'results.jsonl').then((r) => r.text())]);
      viewsText.trim().split('\n').forEach((line) => { const v = JSON.parse(line); state.views[v.candidate_id] = v; });
      state.rows = rowsResp.rows;
      const first = state.rows.findIndex((r) => !r.label);
      state.index = first < 0 ? 0 : first;
      render();
    }
    async function save(label) {
      const row = state.rows[state.index];
      const resp = await fetch('/api/label', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ candidate_id: row.candidate_id, label, note: $('note').value }) });
      const payload = await resp.json();
      if (!resp.ok) { $('status').textContent = payload.error || '保存失败'; $('status').className = 'status error'; return; }
      row.label = label; row.note = $('note').value;
      state.index = Math.min(state.index + 1, state.rows.length - 1);
      render();
    }
    function toggleBox() { state.showBox = !state.showBox; $('box-toggle').classList.toggle('on', state.showBox); render(); }
    document.querySelectorAll('[data-label]').forEach((b) => b.addEventListener('click', () => save(b.dataset.label)));
    $('prev').addEventListener('click', () => { state.index = Math.max(0, state.index - 1); render(); });
    $('next').addEventListener('click', () => { state.index = Math.min(state.rows.length - 1, state.index + 1); render(); });
    $('unlabeled').addEventListener('click', () => { const i = state.rows.findIndex((r) => !r.label); if (i >= 0) { state.index = i; render(); } });
    $('box-toggle').addEventListener('click', toggleBox);
    $('prior-toggle').addEventListener('click', () => { state.showPrior = !state.showPrior; $('prior-toggle').classList.toggle('on', state.showPrior); render(); });
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea')) return;
      if (e.key === '1') save('真车');
      if (e.key === '2') save('屋顶设施');
      if (e.key === '3') save('看不清');
      if (e.key === 'b' || e.key === 'B') toggleBox();
      if (e.key === 'ArrowLeft') $('prev').click();
      if (e.key === 'ArrowRight') $('next').click();
    });
    load().catch((err) => { $('status').textContent = `加载失败：${err}`; $('status').className = 'status error'; });
  </script>
</body>
</html>
