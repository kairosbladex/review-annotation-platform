<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人员人工待标</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #202124; }
    header, main { max-width: 920px; margin: 0 auto; }
    header { padding: 20px 20px 0; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .meta { color: #5f6368; line-height: 1.55; }
    main { padding: 16px 20px 40px; }
    .card { background: #fff; border: 1px solid #dfe1e5; border-radius: 8px; padding: 16px; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    button { min-height: 48px; border: 1px solid #c7cbd1; background: #fff; border-radius: 7px; font: inherit; font-weight: 600; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .yes { border-color: #2f6fed; color: #174ea6; }
    .no { border-color: #d69200; color: #8a5b00; }
    .unclear { border-color: #7b61a8; color: #5d3f8f; }
    ul { padding-left: 18px; }
    li { margin: 8px 0; line-height: 1.5; }
    @media (max-width: 700px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>人员人工待标</h1>
    <p class="meta">只判断初审原框里是不是人员。选项是「是人员」「不是人员」「看不清」。页面不展示模型答案，也不自动填写标签。当前没有可标注的框。</p>
  </header>
  <main>
    <section class="card">
      <p id="count">正在读取队列。</p>
      <div id="groups"></div>
      <div class="actions">
        <button class="yes" type="button" disabled>是人员</button>
        <button class="no" type="button" disabled>不是人员</button>
        <button class="unclear" type="button" disabled>看不清</button>
      </div>
    </section>
  </main>
  <script>
    const count = document.getElementById("count");
    const groups = document.getElementById("groups");
    fetch("/api/queue").then((response) => response.json()).then((payload) => {
      const rows = Array.isArray(payload.eligible) ? payload.eligible : [];
      count.textContent = rows.length
        ? `待标初审框 ${rows.length} 个。标签仍为空白。`
        : "当前没有可标注的初审框。下面各组都还不能进入人工验证。";
      const blocked = Array.isArray(payload.blocked_groups) ? payload.blocked_groups : [];
      if (!blocked.length) return;
      const list = document.createElement("ul");
      blocked.forEach((item) => {
        const line = document.createElement("li");
        line.textContent = `${item.group || "未命名分组"}：${item.reason || "缺少说明"}`;
        list.appendChild(line);
      });
      groups.appendChild(list);
    }).catch(() => {
      count.textContent = "队列没有读到。请从本目录启动 label_server.py 后再打开。";
    });
  </script>
</body>
</html>
